  - {country: Brazil,        iso3: BRA, region: AMER, series_id: "BIS:BR"}
  - {country: Argentina,     iso3: ARG, region: AMER, series_id: "BIS:AR"}
  - {country: Chile,         iso3: CHL, region: AMER, series_id: "BIS:CL"}
  - {country: Colombia,      iso3: COL, region: AMER, series_id: "BIS:CO"}
  - {country: Peru,          iso3: PER, region: AMER, series_id: "BIS:PE"}
  - {country: United Kingdom, iso3: GBR, region: EMEA, series_id: "BIS:GB"}
  - {country: Switzerland,   iso3: CHE, region: EMEA, series_id: "BIS:CH"}
  - {country: Sweden,        iso3: SWE, region: EMEA, series_id: "BIS:SE"}
  - {country: Norway,        iso3: NOR, region: EMEA, series_id: "BIS:NO"}
  - {country: Poland,        iso3: POL, region: EMEA, series_id: "BIS:PL"}
  - {country: Turkey,        iso3: TUR, region: EMEA, series_id: "BIS:TR"}
  - {country: Russia,        iso3: RUS, region: EMEA, series_id: "BIS:RU"}
