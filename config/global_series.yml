  - {country: Japan,         iso3: JPN, region: APAC, series_id: "BIS:JP"}
  - {country: China,         iso3: CHN, region: APAC, series_id: "BIS:CN"}
  - {country: India,         iso3: IND, region: APAC, series_id: "BIS:IN"}
  - {country: South Korea,   iso3: KOR, region: APAC, series_id: "BIS:KR"}
  - {country: Australia,     iso3: AUS, region: APAC, series_id: "BIS:AU"}
