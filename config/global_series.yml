# Global inflation + policy rates (gold.global_inflation /
# gold.global_policy_rates, terminal modules GCPI / GPOL). See
# src/fred_pipeline/global_config.py for field semantics.
#
# The US and developed-market CPI rows use already-active FRED CPI indices with
# yoy_from_index. The wider country map uses World Bank FP.CPI.TOTL.ZG, which
# is annual CPI inflation already expressed as a YoY percent, so those entries
# use transform: level. Policy rates mix FRED (US/Euro Area) and BIS.
#
# target = the central bank's inflation target in percent (drives vs_target).

inflation:
  - {country: United States, iso3: USA, region: AMER, series_id: CPIAUCSL, transform: yoy_from_index, target: 2.0}
  - {country: Canada,        iso3: CAN, region: AMER, series_id: CANCPIALLMINMEI, transform: yoy_from_index, target: 2.0}
  - {country: Mexico,        iso3: MEX, region: AMER, series_id: "MEX:FP.CPI.TOTL.ZG", transform: level, target: 3.0}
  - {country: Brazil,        iso3: BRA, region: AMER, series_id: "BRA:FP.CPI.TOTL.ZG", transform: level, target: 3.0}
